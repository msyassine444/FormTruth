<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <title>FormTruth Test Form</title>
  <style>
    body { font-family: sans-serif; max-width: 500px; margin: 40px auto; padding: 20px; }
    label { display: block; margin-top: 12px; font-weight: 600; }
    input { width: 100%; padding: 8px; margin-top: 4px; border: 1px solid #ccc; border-radius: 6px; }
    button { margin-top: 16px; padding: 10px 20px; background: #4f46e5; color: white; border: none; border-radius: 6px; cursor: pointer; }
  </style>
</head>
<body>
  <h1>Registration Form</h1>
  <form>
    <label>Full Name
      <input type="text" name="name" value="Yassine El Amrani">
    </label>

    <label>Email
      <input type="email" name="email" value="yassine@example.com">
    </label>

    <label>Phone
      <input type="tel" name="phone" value="0611111111">
    </label>

    <label>Date of Birth
      <input type="text" name="dob" value="2009-05-12">
    </label>

    <label>
      <input type="checkbox" name="subscribe"> Subscribe to newsletter
    </label>

    <button type="submit">Submit</button>
  </form>
</body>
</html>

<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <title>FormTruth</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header class="header">
    <div class="brand">
      <span class="brand-mark">FT</span>
      <div class="brand-text">
        <h1>FormTruth</h1>
        <p>Check before you submit</p>
      </div>
    </div>
  </header>

  <main class="content">
    <div class="actions">
      <button id="scanBtn" class="btn btn-primary">
        <span class="btn-label">Scan this form</span>
      </button>
      <button id="pasteTruthBtn" class="btn btn-secondary">
        <span class="btn-label">Edit truth profile</span>
      </button>
    </div>

    <section id="truthSection" class="panel hidden">
      <div class="panel-head">
        <label for="truthInput">Truth Profile (JSON)</label>
        <button id="closeTruthBtn" class="link-btn" type="button">Close</button>
      </div>
      <textarea id="truthInput" spellcheck="false" placeholder='{
  "name": "Yassine Annous",
  "phone": "0612345678"
}'></textarea>
      <button id="saveTruthBtn" class="btn btn-primary btn-full">Save profile</button>
    </section>

    <section id="resultsSection" class="panel hidden">
      <div class="summary" id="summary"></div>
      <div class="results" id="results"></div>
    </section>

    <p id="status" class="status">Ready to scan.</p>
  </main>

  <footer class="footer">
    <span class="version" id="version">v0.2.5</span>
    <a href="http://127.0.0.1:8000/docs" target="_blank" rel="noopener">API docs</a>
  </footer>

  <script src="popup.js"></script>
</body>
</html>
